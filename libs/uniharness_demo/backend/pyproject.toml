[project]
name = "uniharness-demo-backend"
version = "0.1.0"
description = "FastAPI backend for UniHarness demo"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "python-dotenv>=1.0.0",
    "langchain-deepseek>=0.1.0",
    "uniharness",
]

[tool.uv.sources]
uniharness = { path = "../../uniharness", editable = true }
